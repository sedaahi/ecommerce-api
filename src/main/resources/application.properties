spring.application.name=ecommerce-api

# Local'de varsayılan olarak localhost kullanılır.
# Railway'de PGHOST, PGPORT ve PGDATABASE environment variable'ları kullanılır.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ecommerce_db}

# Local'de postgres, Railway'de PGUSER kullanılır.
spring.datasource.username=${PGUSER:postgres}

# Local ve production database password environment variable'dan alınır.
spring.datasource.password=${PGPASSWORD:${DB_PASSWORD}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Railway PORT verirse onu, local'de 8080'i kullan.
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}