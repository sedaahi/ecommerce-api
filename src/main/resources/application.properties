
spring.application.name=ecommerce-api

# PostgreSQL connection (Local / Neon / Render)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# HikariCP - limit database connections-Veritabanına açılan bağlantı sayısını sınırladık.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000

# Server
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET}
